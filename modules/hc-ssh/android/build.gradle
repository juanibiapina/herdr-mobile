plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hcssh'
version = '0.1.0'

android {
  namespace "expo.modules.hcssh"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  packagingOptions {
    resources {
      excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
    }
  }
}

dependencies {
  implementation 'com.github.mwiede:jsch:2.28.8'
  // The same artifact expo-updates uses, so Gradle resolves a single copy.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.83'
}
