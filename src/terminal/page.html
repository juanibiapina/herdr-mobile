<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=6, user-scalable=yes">
<style>/*XTERM_CSS*/</style>
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; height: 100%; overflow: hidden; }
  #wrap { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #term { transform-origin: 0 0; }
  body.fit #term { position: absolute; inset: 4px; }
  .xterm .xterm-viewport { background: #0d1117 !important; }
</style>
</head>
<body>
<div id="wrap"><div id="term"></div></div>
<script>/*XTERM_JS*/</script>
<script>/*FIT_JS*/</script>
<script>
(function () {
  var post = function (msg) { window.ReactNativeWebView.postMessage(JSON.stringify(msg)); };
  var el = document.getElementById("term");
  var term = new Terminal({
    fontSize: 12,
    fontFamily: "'Droid Sans Mono', NerdSymbols, monospace",
    scrollback: 5000,
    disableStdin: true,
    cursorBlink: false,
    allowProposedApi: true,
    theme: { background: "#0d1117", foreground: "#e6edf3", cursor: "#e6edf3" },
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);

  // The app takes keyboard input in its own field; keep xterm's hidden textarea
  // from grabbing focus and the keyboard on a tap.
  var ta = term.textarea;
  if (ta) {
    ta.readOnly = true;
    ta.setAttribute("inputmode", "none");
    ta.setAttribute("tabindex", "-1");
    ta.addEventListener("focus", function () { ta.blur(); });
  }

  var mode = "view";
  var appCursor = false;
  var bracketed = false;

  // Report the cursor-key mode so the key bar sends the arrows the program expects.
  function checkModes() {
    var cur = !!(term.modes && term.modes.applicationCursorKeysMode);
    var bp = !!(term.modes && term.modes.bracketedPasteMode);
    if (cur !== appCursor || bp !== bracketed) {
      appCursor = cur;
      bracketed = bp;
      post({ type: "modes", appCursor: cur, bracketedPaste: bp });
    }
  }

  // One finger: a tap asks for the keyboard; dragging up or down scrolls, with a
  // fling. The normal screen scrolls its history. A full-screen program scrolls
  // itself: mouse wheel when it asked for the mouse, arrow keys otherwise.
  // Pinch zoom and panning a zoomed page stay with the WebView.
  var touch = null, acc = 0, lastY = 0, lastT = 0, velocity = 0, flingTimer = null;

  function rowHeight() {
    var row = el.querySelector(".xterm-rows > div");
    var h = row ? row.getBoundingClientRect().height : 0;
    return h > 2 ? h : 14;
  }

  function wheel(up) {
    var b = up ? 64 : 65;
    var col = Math.ceil(term.cols / 2), row = Math.ceil(term.rows / 2);
    var mouse = term._core && term._core.coreMouseService;
    var enc = mouse && mouse.activeEncoding;
    if (enc === "SGR" || enc === "SGR_PIXELS") return "\x1b[<" + b + ";" + col + ";" + row + "M";
    return "\x1b[M" + String.fromCharCode(32 + b, 32 + Math.min(col, 223), 32 + Math.min(row, 223));
  }

  function selfScrolls() {
    return term.buffer.active.type === "alternate";
  }

  // lines > 0: toward older output (the finger moves down).
  function scrollBy(lines) {
    if (!lines) return;
    if (!selfScrolls()) { term.scrollLines(-lines); return; }
    var mouse = term.modes.mouseTrackingMode !== "none";
    var up = lines > 0, out = "";
    for (var i = 0; i < Math.min(Math.abs(lines), 30); i++) {
      out += mouse ? wheel(up) : (appCursor ? "\x1bO" : "\x1b[") + (up ? "A" : "B");
    }
    post({ type: "input", data: out });
  }

  function step(dy) {
    acc += dy;
    var h = rowHeight(), lines = acc > 0 ? Math.floor(acc / h) : Math.ceil(acc / h);
    if (lines) { acc -= lines * h; scrollBy(lines); }
  }

  function stopFling() {
    if (flingTimer) { clearInterval(flingTimer); flingTimer = null; }
  }

  function fling(v) {
    stopFling();
    // Arrow keys would land as a burst of keystrokes: no fling for those.
    if (selfScrolls() && term.modes.mouseTrackingMode === "none") return;
    flingTimer = setInterval(function () {
      v *= 0.94;
      if (Math.abs(v) < 0.05) return stopFling();
      step(v * 16);
    }, 16);
  }

  window.addEventListener("touchstart", function (e) {
    stopFling();
    if (e.touches.length !== 1) { touch = null; return; }
    var p = e.touches[0];
    touch = { x: p.clientX, y: p.clientY, t: Date.now(), moved: false, scrolling: false };
    acc = 0; velocity = 0; lastY = p.clientY; lastT = Date.now();
  }, { passive: true, capture: true });

  window.addEventListener("touchmove", function (e) {
    if (!touch) return;
    if (e.touches.length !== 1) { touch = null; return; }
    var p = e.touches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y;
    if (!touch.moved && dx * dx + dy * dy > 100) {
      touch.moved = true;
      var zoomed = window.visualViewport && window.visualViewport.scale > 1.01;
      touch.scrolling = Math.abs(dy) > Math.abs(dx) && !zoomed;
      lastY = p.clientY; lastT = Date.now();
    }
    if (!touch.scrolling) return;
    e.preventDefault();
    e.stopPropagation();
    var now = Date.now(), d = p.clientY - lastY;
    velocity = d / Math.max(1, now - lastT);
    lastY = p.clientY; lastT = now;
    step(d);
  }, { passive: false, capture: true });

  window.addEventListener("touchend", function (e) {
    if (!touch) return;
    if (!touch.moved && Date.now() - touch.t < 350) post({ type: "tap" });
    else if (touch.scrolling) {
      e.stopPropagation();
      if (Math.abs(velocity) > 0.3 && Date.now() - lastT < 80) fling(velocity);
    }
    touch = null;
  }, { passive: true, capture: true });

  window.addEventListener("touchcancel", function () { touch = null; }, { passive: true, capture: true });
  var size = { cols: 80, rows: 24 };

  // View mode: the terminal keeps its own size, scaled to the screen width.
  function scaleToWidth() {
    var screen = el.querySelector(".xterm-screen");
    if (!screen) return;
    var w = screen.offsetWidth || 1;
    var s = Math.min(1, window.innerWidth / w);
    el.style.transform = "scale(" + s + ")";
    el.style.width = w + "px";
    document.getElementById("wrap").style.height = "100%";
  }

  function layout() {
    if (mode === "fit") {
      el.style.transform = "";
      el.style.width = "";
      fit.fit();
      if (term.cols !== size.cols || term.rows !== size.rows) {
        size = { cols: term.cols, rows: term.rows };
        post({ type: "size", cols: term.cols, rows: term.rows });
      }
    } else {
      term.resize(size.cols, size.rows);
      scaleToWidth();
    }
  }

  function bytes(b64) {
    var s = atob(b64), out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  window.hc = {
    receive: function (msg) {
      if (msg.type === "write") {
        var data = bytes(msg.data);
        term.write(data, function () {
          post({ type: "written", bytes: data.length });
          checkModes();
        });
      } else if (msg.type === "reset") {
        term.reset();
        checkModes();
      } else if (msg.type === "mode") {
        mode = msg.mode;
        document.body.className = mode;
        if (msg.cols && msg.rows) size = { cols: msg.cols, rows: msg.rows };
        layout();
      } else if (msg.type === "size") {
        if (mode === "view") { size = { cols: msg.cols, rows: msg.rows }; layout(); }
      } else if (msg.type === "font") {
        term.options.fontSize = msg.size;
        layout();
      } else if (msg.type === "bottom") {
        term.scrollToBottom();
      }
    },
  };

  // Measure again once the icon font is in, so cells keep their width.
  if (document.fonts && document.fonts.load) {
    document.fonts.load("12px NerdSymbols").then(function () { term.options.fontFamily = term.options.fontFamily; layout(); });
  }

  window.addEventListener("resize", layout);
  post({ type: "ready" });
})();
</script>
</body>
</html>
